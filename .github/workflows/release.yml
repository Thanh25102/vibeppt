name: Release site

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: edge

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: thanh25102/vibeppt-site
  VERSION: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  sample:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node dist/cli.js build templates/launch-signal/sample-deck.json --out .artifacts/release-sample --scale 1 --force
      - run: |
          cp .artifacts/release-sample/turn-attention-into-momentum.pptx vibeppt-launch-signal-sample.pptx
          cp .artifacts/release-sample/contact-sheet.png vibeppt-launch-signal-contact-sheet.png
          cp .artifacts/release-sample/qa.json vibeppt-launch-signal-qa.json
      - run: gh release upload "${VERSION}" vibeppt-launch-signal-sample.pptx vibeppt-launch-signal-contact-sheet.png vibeppt-launch-signal-qa.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
